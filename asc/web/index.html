<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="asctl-token" content="@TOKEN@">
<meta name="asctl-version" content="@VERSION@">
<title>@TITLE@</title>
<!-- iOS colours its status bar from theme-color; Android takes the manifest's -->
<meta name="theme-color" content="#f1f1f4">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=@V@">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png?v=@V@">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=@V@">
<link rel="manifest" href="manifest.json?v=@V@">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="@LABEL@">
<link rel="stylesheet" href="app.css">
<!-- fetched with the stylesheet, not after it: the splash must be ready at the first paint -->
<link rel="preload" href="splash.js" as="script">
<link rel="preload" href="splash-512.png?v=@V@" as="image">
<script src="app.js" defer></script>
</head>
<body>
<!-- The installed app's launch splash: first in the body, so it paints before anything else -->
<div id="splash"><img src="splash-512.png?v=@V@" alt=""></div>
<script src="splash.js"></script>
<!-- Back to the installed app that opened this page inside its window (app.js: backLink); hidden otherwise -->
<a class="back" id="back" href="#" hidden><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3.5 5.5 9l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</a>
<header>
  <div class="title"><h1>@TITLE@</h1><div class="sub mono" id="host"></div></div>
  <div class="side">
    <div class="mew"><div class="me" id="me"></div>
      <button class="nup" id="nup" type="button" hidden aria-expanded="false" aria-controls="stale" aria-label="Not updating: why?"><svg width="22" height="20" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 2 22.5 20H1.5z" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M12 8.2v5.6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="17" r="1.4" fill="#fff"/></svg></button></div>
    <div class="upd"><span id="upd"></span><button class="rf" id="rf" type="button" aria-label="Refresh" title="Refresh now"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg></button><button class="rf gear" id="gear" type="button" aria-label="Settings" aria-haspopup="dialog" title="Settings"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>
  </div>
</header>
<div class="stale" id="stale" hidden></div>
<div class="banner" id="banner" hidden></div>
<div id="notes"></div>

<section class="mem" id="mem" aria-label="Memory">
  <div class="head"><div class="lab">MEMORY<span class="det" id="mem-det"></span><button class="about" id="mem-about" type="button" aria-expanded="false" aria-controls="mem-note" aria-label="About these memory numbers"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.75"/><path d="M8 7.25v4"/><circle class="dot" cx="8" cy="4.9" r=".9"/></svg></button></div><div class="big" id="mem-pct"></div></div>
  <div class="bar" id="mem-bar"><span class="fill" id="mem-used"><i class="k-you" id="mem-you"></i><i class="k-users" id="mem-users"></i><i class="k-sys" id="mem-sys"></i></span><b id="mem-gate"></b></div>
  <div class="foot"><span class="swap" id="swap" hidden></span><button class="key" id="mem-key" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="mem-top" hidden></button></div>
  <div class="pop" id="mem-top" role="dialog" aria-label="Your biggest processes" hidden><div class="sub">Your biggest processes</div><div id="top"></div></div>
  <div class="pop note" id="mem-note" role="dialog" aria-label="About these memory numbers" hidden>Memory numbers may not be exact. Sessions start only below the orange mark.</div>
</section>

<div class="newrow"><div class="chips" id="chips" role="group" aria-label="Show"></div><button class="btn sm p" id="newbtn" type="button" aria-label="New session" title="New session">+ New<span class="lbl"> session</span></button></div>
<main id="lists"></main>

<div class="sect">Past conversations</div>
<input class="search" id="q" type="search" placeholder="Search titles and folders" autocomplete="off">
<div class="list" id="past"></div>


<div class="toast" id="toast" role="status" hidden></div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"></div></div>
<div class="dscrim" id="dscrim" hidden><div class="dlg" id="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-m">
  <h3 id="dlg-t"></h3><p id="dlg-m"></p>
  <input id="dlg-in" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="31" hidden>
  <div class="dlg-err" id="dlg-err" aria-live="polite"></div>
  <div class="dlg-b"><button class="btn" id="dlg-no" type="button">Cancel</button><button class="btn p" id="dlg-ok" type="button">OK</button></div>
</div></div>
</body>
</html>
