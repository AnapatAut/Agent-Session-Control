<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="asctl-token" content="@TOKEN@">
<title>Agent Session Control</title>
<!-- iOS colours its status bar from theme-color; Android takes the manifest's -->
<meta name="theme-color" content="#f1f1f4">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=@V@">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png?v=@V@">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=@V@">
<link rel="manifest" href="manifest.json?v=@V@">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sessions">
<link rel="stylesheet" href="app.css">
<!-- fetched with the stylesheet, not after it: the splash must be ready at the first paint -->
<link rel="preload" href="splash.js" as="script">
<link rel="preload" href="splash-512.png?v=@V@" as="image">
<script src="app.js" defer></script>
</head>
<body>
<!-- The installed app's launch splash: first in the body, so it paints before anything else -->
<div id="splash"><img src="splash-512.png?v=@V@" alt=""></div>
<script src="splash.js"></script>
<header>
  <div class="title"><h1>Agent Session Control</h1><div class="sub mono" id="host"></div></div>
  <div class="side">
    <div class="mew"><div class="me" id="me"></div>
      <button class="nup" id="nup" type="button" hidden aria-expanded="false" aria-controls="stale" aria-label="Not updating: why?"><svg width="22" height="20" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 2 22.5 20H1.5z" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M12 8.2v5.6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="17" r="1.4" fill="#fff"/></svg></button></div>
    <div class="upd"><span id="upd"></span><button class="rf" id="rf" type="button" aria-label="Refresh" title="Refresh now"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg></button></div>
  </div>
</header>
<div class="stale" id="stale" hidden></div>
<div class="banner" id="banner" hidden></div>
<div id="notes"></div>

<section class="mem" id="mem" aria-label="Memory">
  <div><div class="lab">MEMORY</div><div class="big" id="mem-pct"></div></div>
  <div class="bar" id="mem-bar" title="Used = total minus what the kernel calls available (what earlyoom and starts go by; htop counts some shared memory and kernel caches as free). Starts need at most 80% used."><i id="mem-used"></i><b id="mem-gate"></b></div>
  <div class="det" id="mem-det"></div>
</section>

<div class="chips" id="chips" role="group" aria-label="Show"></div>
<main id="lists"></main>

<div class="sect">Past conversations</div>
<input class="search" id="q" type="search" placeholder="Search titles and folders" autocomplete="off">
<div class="list" id="past"></div>

<details class="top"><summary>Settings</summary><div class="opts" id="opts"></div></details>
<details class="top"><summary>Memory in use</summary><div class="list procs" id="use"></div></details>
<details class="top"><summary>Your biggest processes</summary><div class="list procs" id="top"></div></details>

<div class="toast" id="toast" role="status" hidden></div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"></div></div>
<div class="dscrim" id="dscrim" hidden><div class="dlg" id="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-m">
  <h3 id="dlg-t"></h3><p id="dlg-m"></p>
  <input id="dlg-in" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="31" hidden>
  <div class="dlg-err" id="dlg-err" aria-live="polite"></div>
  <div class="dlg-b"><button class="btn" id="dlg-no" type="button">Cancel</button><button class="btn p" id="dlg-ok" type="button">OK</button></div>
</div></div>
</body>
</html>
