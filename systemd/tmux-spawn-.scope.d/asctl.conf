# tmux puts each session it starts in a scope of its own (tmux-spawn-*.scope). systemd's
# default, OOMPolicy=stop, ends the whole scope when the kernel kills one process in it for
# memory: the session would be gone. With continue only that claude ends (exit 137, recorded
# by asctl-wrap) and its pane stays, for the watcher.
[Scope]
OOMPolicy=continue
